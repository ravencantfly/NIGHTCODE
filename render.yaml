services:
  - type: web
    name: collab-code-editor
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --worker-class gthread -w 1 --threads 8 app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: collab-editor-db
          property: connectionString

databases:
  - name: collab-editor-db
    plan: free
