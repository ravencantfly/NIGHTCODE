<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign up — Nightcode</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1 class="auth-title">Nightcode</h1>
    <p class="auth-subtitle">Create an account to start coding together.</p>
    <form id="signupForm">
      <input id="username" placeholder="Username" maxlength="20" autocomplete="username" required>
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password (min. 6 characters)" autocomplete="new-password" required>
      <div id="authError" class="auth-error hidden"></div>
      <button type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
  </div>

  <script>
    document.getElementById("signupForm").onsubmit = async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("authError");
      errorEl.classList.add("hidden");
      const res = await fetch("/api/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error || "Something went wrong.";
        errorEl.classList.remove("hidden");
        return;
      }
      window.location.href = new URLSearchParams(window.location.search).get("next") || "/";
    };
  </script>
</body>
</html>
